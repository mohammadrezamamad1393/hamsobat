<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>هم‌صحبت | ورود</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="login-wrap"><section class="login-card"><div class="logo">هـ</div><h1>هم‌صحبت</h1><p class="muted">چت خصوصی گروه دوستان</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post" class="login-form"><label>اسم نمایشی</label><input name="name" value="{{ name }}" maxlength="24" required autocomplete="username" placeholder="مثلاً علی"><label>رمز عبور</label><input type="password" name="password" minlength="4" maxlength="128" required autocomplete="current-password" placeholder="رمز خودت را وارد کن"><button type="submit">ورود / ساخت حساب</button></form><p class="hint">بار اول با اسم و رمزت حساب ساخته می‌شود؛ دفعات بعد با همان رمز وارد شو.</p></section></main></body></html>
